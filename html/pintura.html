<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="titulo">Andrés Ramírez Ortíz</title>
  <link href="https://fonts.googleapis.com/css2?family=GFS+Didot&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <!-- Franja de pestañas: navegación por series (encima del header) -->
  <nav class="series-tabs" id="series-tabs">
    <button class="series-toggle" aria-label="Menú" aria-expanded="false">☰</button>
    <a href="index.html" class="tab active">Inicio</a>
    <a href="serie.html?serie=serie_nubes" class="tab">Nubes</a>
    <a href="serie.html?serie=serie_vestigio" class="tab">Vestigio</a>
    <a href="serie.html?serie=serie_paisaje" class="tab">Paisaje</a>
    <a href="serie.html?serie=serie_selfie" class="tab">Selfie</a>
    <a href="serie.html?serie=serie_exploradores" class="tab">Exploradores</a>
  </nav>

  <!-- Hero: nombre de la obra (15% de altura, efecto frost) -->
  <header class="hero-header">
    <div class="hero-fondo" id="hero-fondo"></div>
    <div class="hero-overlay"></div>
    <div class="hero-contenido">
      <h1 id="pintura-titulo">Obra</h1>
    </div>
  </header>

  <!-- Detalle de la obra - Layout 2: Imagen arriba, info debajo -->
  <main class="pintura-detalle max-width-container">
    <!-- Imagen grande (full width) -->
    <div class="detail-image-container layout2">
      <img id="imagen-grande" src="" alt="" class="detail-image">
    </div>

    <!-- Detalles y carrusel: justo debajo de la foto principal -->
    <section class="detalles" id="seccion-detalles">
      <h3 data-i18n="detalles">Detalles</h3>
      <div id="detalles-carousel" class="carousel"></div>
    </section>

    <!-- Información de la obra -->
    <div class="detail-info">
      <!-- Título -->
      <h1 id="pintura-titulo-detalle" class="pintura-titulo-detalle"></h1>
      
      <!-- Ficha técnica: la única lista de datos de la ficha -->

      <div class="ficha-tecnica layout2" id="ficha-tecnica">
        <!-- Se llena dinámicamente -->
      </div>

      <!-- Precio: abre una ventana para solicitar el precio por correo -->
      <div class="precio-caja" id="precio-caja">
        <button type="button" class="btn-ver-precio" id="btn-ver-precio">Solicitar precio</button>
      </div>
      
      <!-- Botón volver -->
      <button type="button" class="btn btn-go-back" onclick="history.back()">
        Volver
      </button>
    </div>

  <!-- Pie de página: datos de contacto -->
  <footer class="pie-pagina">
    <p class="pie-titulo">Contacto</p>
    <ul class="pie-datos">
      <li>
        <span class="pie-etiqueta">Correo</span>
        <a href="mailto:buscongo@gmail.com">buscongo@gmail.com</a>
      </li>
      <li>
        <span class="pie-etiqueta">Instagram</span>
        <a href="https://instagram.com/buscongo_fineart" target="_blank" rel="noopener">buscongo_fineart</a>
      </li>
      <li>
        <span class="pie-etiqueta">Consultas y encargos</span>
        <a href="tel:+50683487471">(506) 8348 7471</a>
      </li>
    </ul>
  </footer>
  </main>

  <!-- Ventana: solicitud de precio por correo -->
  <div id="solicitud-overlay" class="modal-overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="solicitud-titulo">
      <button type="button" class="modal-cerrar" id="solicitud-cerrar" aria-label="Cerrar">&times;</button>
      <div class="modal-content">
        <h3 id="solicitud-titulo" class="solicitud-titulo">Solicitar el precio de la obra</h3>
        <p class="solicitud-obra" id="solicitud-obra"></p>

        <form id="form-solicitud" class="solicitud-form" novalidate>
          <label class="campo-grupo">
            <span>Nombre y apellidos *</span>
            <input type="text" id="solicitud-nombre" autocomplete="name"
                   placeholder="Cómo te llamás" required>
          </label>

          <label class="campo-grupo">
            <span>Tu correo *</span>
            <input type="email" id="solicitud-correo" autocomplete="email"
                   placeholder="Para responderte" required>
          </label>

          <label class="campo-grupo">
            <span>Galería o cliente *</span>
            <input type="text" id="solicitud-galeria" autocomplete="organization"
                   placeholder="A nombre de quién va la consulta" required>
          </label>

          <label class="campo-grupo">
            <span>Mensaje *</span>
            <textarea id="solicitud-mensaje" rows="3" required
                      placeholder="Contame qué te interesa de la obra"></textarea>
          </label>

          <button type="submit" class="btn btn-primario" id="solicitud-enviar">Enviar solicitud</button>
          <p class="solicitud-aviso" id="solicitud-aviso" role="status"></p>
        </form>
      </div>
    </div>
  </div>

  <!-- Zoom overlay (imagen a pantalla completa) -->
  <div id="zoom-overlay" class="zoom-overlay">
    <button type="button" id="zoom-close" class="zoom-close" aria-label="Cerrar">×</button>
    <img id="zoom-imagen" class="zoom-imagen" alt="">
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/pintura.js"></script>
  <script src="../js/proteger-imagenes.js"></script>
</body>
</html>
