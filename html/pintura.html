<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="titulo">Andrés Ramírez Ortíz</title>
  <link href="https://fonts.googleapis.com/css2?family=GFS+Didot&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <!-- Franja de pestañas: navegación por series (encima del header) -->
  <nav class="series-tabs" id="series-tabs">
    <button class="series-toggle" aria-label="Menú" aria-expanded="false">☰</button>
    <a href="index.html" class="tab active">Inicio</a>
    <a href="serie.html?serie=serie_nubes" class="tab">Nubes</a>
    <a href="serie.html?serie=serie_vestigio" class="tab">Vestigio</a>
    <a href="serie.html?serie=serie_paisaje" class="tab">Paisaje</a>
    <a href="serie.html?serie=serie_selfie" class="tab">Selfie</a>
    <a href="serie.html?serie=serie_exploradores" class="tab">Exploradores</a>
  </nav>

  <!-- Hero: nombre de la obra (15% de altura, efecto frost) -->
  <header class="hero-header">
    <div class="hero-fondo" id="hero-fondo"></div>
    <div class="hero-overlay"></div>
    <div class="hero-contenido">
      <h1 id="pintura-titulo">Obra</h1>
    </div>
  </header>

  <!-- Detalle de la obra - Layout 2: Imagen arriba, info debajo -->
  <main class="pintura-detalle max-width-container">
    <!-- Imagen grande (full width) -->
    <div class="detail-image-container layout2">
      <img id="imagen-grande" src="" alt="" class="detail-image">
    </div>

    <!-- Detalles y carrusel: justo debajo de la foto principal -->
    <section class="detalles" id="seccion-detalles">
      <h3 data-i18n="detalles">Detalles</h3>
      <div id="detalles-carousel" class="carousel"></div>
    </section>

    <!-- Información de la obra -->
    <div class="detail-info">
      <!-- Título -->
      <h1 id="pintura-titulo-detalle" class="pintura-titulo-detalle"></h1>
      
      <!-- Ficha técnica: la única lista de datos de la ficha -->

      <div class="ficha-tecnica layout2" id="ficha-tecnica">
        <!-- Se llena dinámicamente -->
      </div>

      <!-- Precio: oculto hasta pulsar «Ver precio»; solo si la obra está disponible -->
      <div class="precio-caja" id="precio-caja" hidden>
        <button type="button" class="btn-ver-precio" id="btn-ver-precio">Ver precio</button>
        <p id="pintura-precio" class="pintura-precio" hidden></p>
      </div>
      
      <!-- Botón volver -->
      <button type="button" class="btn btn-go-back" onclick="history.back()">
        ← Volver
      </button>
    </div>
  </main>

  <!-- Zoom overlay (imagen a pantalla completa) -->
  <div id="zoom-overlay" class="zoom-overlay">
    <button type="button" id="zoom-close" class="zoom-close" aria-label="Cerrar">×</button>
    <img id="zoom-imagen" class="zoom-imagen" alt="">
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/pintura.js"></script>
  <script src="../js/proteger-imagenes.js"></script>
</body>
</html>
