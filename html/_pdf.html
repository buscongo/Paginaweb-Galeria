<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}iframe{display:block;border:0}</style></head><body>
<script>
var irAPerfil = /p=2/.test(location.search);
fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: 'prueba123' }) })
  .then(function () {
    var f = document.createElement('iframe');
    f.style.cssText = 'width:1200px;height:800px;border:0;position:absolute;left:-9999px';
    f.src = '/exportar.html';
    document.body.appendChild(f);

    setTimeout(async function () {
      var w = f.contentWindow;
      var obras = (w.obrasExp || []).slice(0, 2);
      var imgs = await w.prepararImagenes(obras);
      var perfil = await w.leerPerfil();
      var html = w.construirDocumento('Serie Nubes 2026', obras, imgs, { perfil: perfil, precios: false });

      var visor = document.createElement('iframe');
      visor.style.cssText = 'width:1920px;height:1200px;border:0';
      visor.srcdoc = html;
      document.body.appendChild(visor);
      setTimeout(function () {
        if (irAPerfil) visor.contentWindow.scrollTo(0, 1136);
      }, 1500);
    }, 4000);
  });
</script></body></html>
