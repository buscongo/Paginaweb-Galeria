<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="tituloAdmin">Admin — Andrés Ramírez Ortíz</title>
  <link href="https://fonts.googleapis.com/css2?family=GFS+Didot&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <!-- Navegación por series (igual que la home) -->
  <nav class="series-tabs" id="series-tabs">
    <button class="series-toggle" aria-label="Menú" aria-expanded="false">☰</button>
    <a href="index.html" class="tab">Inicio</a>
    <a href="admin.html" class="tab active">Admin</a>
  </nav>

  <header class="admin-header">
    <h1>Admin</h1>
    <div class="admin-header-acciones">
      <button type="button" id="lang-toggle" class="lang-toggle">EN</button>
      <button type="button" id="btn-salir" class="btn btn-cancelar">Salir</button>
    </div>
  </header>

  <main class="admin-main">
    <!-- Entrada: dos acciones -->
    <div class="admin-acciones">
      <button type="button" id="btn-editar" class="btn-admin" aria-expanded="false" aria-controls="panel-editar">
        Editar
      </button>
      <a href="subir.html" class="btn-admin">Subir obra</a>
      <a href="exportar.html" class="btn-admin">Exportar PDF</a>
    </div>

    <p id="aviso-admin" class="aviso-admin" hidden></p>

    <!-- Panel de obras agrupadas por serie -->
    <section id="panel-editar" class="panel-editar" hidden>
      <div class="filtros-barra">
        <div class="filtros-selects">
          <select id="filtro-serie" aria-label="Filtrar por serie"></select>
          <select id="filtro-ano" aria-label="Filtrar por año"></select>
          <select id="filtro-disponibilidad" aria-label="Filtrar por disponibilidad"></select>
        </div>
        <div class="filtros-acciones">
          <label class="campo-check"><input type="checkbox" id="chk-archivadas"> Ver archivadas</label>
        </div>
      </div>
      <div id="barra-seleccion" class="barra-seleccion" hidden>
        <span id="seleccion-cuenta" class="seleccion-cuenta">0 seleccionadas</span>
        <button type="button" class="btn btn-primario" id="btn-editar-masivo">Editar seleccionadas</button>
        <button type="button" class="btn btn-cancelar" id="btn-limpiar-seleccion">Quitar selección</button>
      </div>

      <div id="obras-por-serie"></div>
    </section>
  </main>

  <script src="../js/data.js"></script>
  <script src="../js/admin-gate.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/mantener-mediums.js"></script>
</body>
</html>
